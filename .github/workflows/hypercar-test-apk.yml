name: HyperCar Honda DiPlay 0.3.11 test APK

on:
  push:
    branches: ['**']
    paths:
      - 'HyperCar/**'
      - '.github/workflows/hypercar-test-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hypercar-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null 2>&1 || cargo install cargo-ndk --locked

      - name: Rust check and tests
        working-directory: HyperCar/rust-core
        run: cargo check --locked && cargo test --locked

      - name: Build Rust JNI library
        working-directory: HyperCar/rust-core
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android tests, lint and debug APK
        working-directory: HyperCar
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libhypercar_core.so'
          sha256sum app/build/outputs/apk/debug/app-debug.apk > test-debug-sha256.txt

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperCar-Honda-DiPlay-test-${{ github.run_number }}
          path: |
            HyperCar/app/build/outputs/apk/debug/app-debug.apk
            HyperCar/test-debug-sha256.txt
          if-no-files-found: error
          retention-days: 14
