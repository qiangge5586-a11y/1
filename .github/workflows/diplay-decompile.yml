name: DiPlay APK Decompile
on:
  workflow_dispatch:
  push:
    paths:
      - "diplay0.3.11.apk"
      - ".github/workflows/diplay-decompile.yml"
permissions:
  contents: read
jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify APK
        run: |
          set -euo pipefail
          APK="diplay0.3.11.apk"
          test -s "$APK"
          mkdir -p DiPlay/decompiled
          sha256sum "$APK" | tee DiPlay/SHA256SUMS.txt
          ACTUAL=$(sha256sum "$APK" | awk '{print $1}')
          EXPECTED="22f61878e0e7e78a3fb9c2e2051881d3cc2e4b0232f4c3f13090ace04a966fb1"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: APK SHA-256 differs from the recorded original."
            exit 1
          fi
      - name: Install JADX and APKTool
        run: |
          set -euo pipefail
          mkdir -p tools
          JADJ_JSON=$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest)
          JADJ_URL=$(echo "$JADJ_JSON" | jq -r '.assets[] | select(.name | test("^jadx-[0-9.]+\\.zip$")) | .browser_download_url' | head -n1)
          test -n "$JADJ_URL"
          curl -fsSL "$JADJ_URL" -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d tools/jadx
          APKTOOL_JSON=$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest)
          APKTOOL_URL=$(echo "$APKTOOL_JSON" | jq -r '.assets[] | select(.name | test("^apktool_[0-9.]+\\.jar$")) | .browser_download_url' | head -n1)
          test -n "$APKTOOL_URL"
          curl -fsSL "$APKTOOL_URL" -o tools/apktool.jar
          java -jar tools/apktool.jar --version
          tools/jadx/bin/jadx --version
      - name: Decompile Java sources (preserve partial output on decoder errors)
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p DiPlay/decompiled/jadx
          set +e
          tools/jadx/bin/jadx --show-bad-code --deobf -d DiPlay/decompiled/jadx diplay0.3.11.apk 2>&1 | tee DiPlay/decompiled/jadx.log
          JADX_EXIT=${PIPESTATUS[0]}
          set -e
          echo "$JADX_EXIT" > DiPlay/decompiled/JADX_EXIT_CODE.txt
          if [ "$JADX_EXIT" -ne 0 ]; then
            echo "JADX returned $JADX_EXIT after producing partial output; continuing with APKTool."
          fi
          test -d DiPlay/decompiled/jadx
      - name: Audit ROOT hotspot safety patterns
        run: |
          set -euo pipefail
          python3 DiPlay/tools/audit-hotspot-safety.py \
            --sources DiPlay/decompiled/jadx/sources \
            --out DiPlay/decompiled/hotspot-safety-audit.md
          test -s DiPlay/decompiled/hotspot-safety-audit.md
      - name: Decode manifest resources and Smali
        run: |
          set -euo pipefail
          java -jar tools/apktool.jar d -f diplay0.3.11.apk -o DiPlay/decompiled/apktool
      - name: Preserve focused iAP2 Smali evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import shutil

          root = "DiPlay/decompiled/apktool"
          out = "DiPlay/decompiled/iap2-smali"
          needles = (
              "Iap2LinkEngine", "Iap2LinkChannel", "Iap2LinkConfig",
              "Iap2CsmChannel", "Iap2CsmFramer", "Iap2Session",
              "Iap2Frame", "Iap2WirelessControlClient"
          )
          os.makedirs(out, exist_ok=True)
          selected = []
          for base, _, files in os.walk(root):
              for name in files:
                  if not name.endswith(".smali"):
                      continue
                  source = os.path.join(base, name)
                  with open(source, "r", encoding="utf-8", errors="replace") as handle:
                      data = handle.read()
                  if not any(token in data or token in name for token in needles):
                      continue
                  relative = os.path.relpath(source, root)
                  target = os.path.join(out, relative)
                  os.makedirs(os.path.dirname(target), exist_ok=True)
                  shutil.copy2(source, target)
                  digest = hashlib.sha256(data.encode("utf-8")).hexdigest()
                  selected.append((relative, digest, len(data.splitlines())))
          selected.sort()
          with open(os.path.join(out, "INDEX.txt"), "w", encoding="utf-8") as index:
              index.write("Focused Smali files copied from APKTool output.\n")
              index.write("Original APK SHA-256: 22f61878e0e7e78a3fb9c2e2051881d3cc2e4b0232f4c3f13090ace04a966fb1\n")
              index.write("Selection: iAP2 link, CSM, session and wireless-control class references.\n\n")
              for relative, digest, lines in selected:
                  index.write("%s | lines=%d | sha256=%s\n" % (relative, lines, digest))
          if not selected:
              raise SystemExit("No focused iAP2 Smali files found; refusing to upload an empty evidence bundle.")
          print("Preserved %d focused iAP2 Smali files." % len(selected))
          PY
      - name: Write report
        run: |
          {
            echo "# DiPlay 0.3.11 decompilation"
            echo
            echo "Source: diplay0.3.11.apk"
            echo
            echo "SHA-256:"
            sha256sum diplay0.3.11.apk
            echo
            echo "Outputs: JADX Java-like source (see JADX_EXIT_CODE.txt and jadx.log for decoder diagnostics); APKTool manifest, resources and Smali."
            echo
            echo "JADX exit code:"
            cat DiPlay/decompiled/JADX_EXIT_CODE.txt
          } > DiPlay/decompiled/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: diplay-0.3.11-decompiled
          path: |
            DiPlay/decompiled/
            DiPlay/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
