name: DiPlay 0.3.11 + Honda Compatibility Merge

on:
  workflow_dispatch:
  push:
    paths:
      - "diplay0.3.11.apk"
      - "DiPlay/compat/**"
      - "DiPlay/android/compat-overlay/**"
      - "DiPlay/android/settings.gradle"
      - "DiPlay/android/build.gradle"
      - "tools/build-diplay-merged.sh"
      - "tools/patch-diplay-original.py"
      - "tools/check-mfi-release-hygiene.py"
      - ".github/workflows/diplay-original-merge.yml"

permissions:
  contents: read

jobs:
  merge-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Apktool 3.0.3
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar" -o "$RUNNER_TEMP/apktool.jar"
          printf '#!/usr/bin/env bash\nexec java -jar "%s" "$@"\n' "$RUNNER_TEMP/apktool.jar" > "$RUNNER_TEMP/apktool"
          chmod +x "$RUNNER_TEMP/apktool"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Test MFi asset-preservation hygiene rules
        run: python3 tools/test_check_mfi_release_hygiene.py
      - name: Compile compatibility overlay
        working-directory: DiPlay/android
        run: gradle --no-daemon :compat-overlay:assembleRelease
      - name: Merge with original DiPlay 0.3.11 APK
        env:
          APKTOOL_BIN: apktool
        run: bash tools/build-diplay-merged.sh
      - name: Upload merged test APK
        uses: actions/upload-artifact@v4
        with:
          name: diplay-0.3.11-honda-compat
          path: DiPlay/android/build/outputs/apk/merged/diplay-0.3.11-honda-compat.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload merged source bundle
        uses: actions/upload-artifact@v4
        with:
          name: diplay-0.3.11-honda-source
          path: DiPlay/android/build/outputs/apk/merged/diplay-0.3.11-honda-source.zip
          if-no-files-found: error
          retention-days: 14
