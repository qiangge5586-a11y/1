name: DiPlay iAP2 Wireless Handshake Tests
# CI includes source-grounded link frame and synchronization payload golden vectors.
on:
  workflow_dispatch:
  push:
    paths:
      - "DiPlay/compat/iap2/**"
      - "DiPlay/compat/bluetooth/**"
      - "DiPlay/compat/mfi/**"
      - ".github/workflows/diplay-iap2-handshake.yml"
permissions:
  contents: read
jobs:
  compile-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Compile Java 7 and run offline handshake tests
        run: |
          set -euo pipefail
          mkdir -p build/iap2-test
          javac -source 1.7 -target 1.7 -Xlint:-options -d build/iap2-test $(find DiPlay/compat/iap2 -maxdepth 2 -name '*.java' -print) DiPlay/compat/bluetooth/BoundedByteRingBuffer.java DiPlay/compat/bluetooth/RfcommConnectDeadline.java DiPlay/compat/bluetooth/test/BoundedByteRingBufferTest.java DiPlay/compat/bluetooth/test/RfcommConnectDeadlineTest.java $(find DiPlay/compat/mfi -maxdepth 2 -name '*.java' -print)
          java -cp build/iap2-test com.shilapi.xcertplay.compat.bluetooth.BoundedByteRingBufferTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.bluetooth.RfcommConnectDeadlineTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.mfi.MfiOperationContextTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.mfi.MfiProviderSessionTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.mfi.MfiI2cCertificateReaderTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.mfi.MfiBackendSelectionPolicyTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2DuplexByteStreamTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2LinkPumpContractTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2CsmPumpSenderTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2LinkModelPumpDriverTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2WirelessHandshakeTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2WirelessDeadlineBudgetTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.IapTunnelFramingTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2CsmFrameDecoderTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2CsmFrameCodecTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2CsmReceiveQueueModelTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2CsmReceiveCoordinatorTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2CsmSendPlanTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2LinkCommandQueueModelTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2CsmSendDeadlineTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2CsmSendAdmissionModelTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2CsmLinkGateModelTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2LinkFrameCodecTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2LinkFrameDecoderTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2LinkNegotiationModelTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2RetransmissionPolicyTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2ReceiveWindowModelTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2AckWindowPolicyTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2OutboundWindowModelTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2LinkEngineModelTest
