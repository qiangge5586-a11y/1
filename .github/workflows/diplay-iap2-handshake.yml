name: DiPlay iAP2 Wireless Handshake Tests
# CI includes source-grounded link frame and synchronization payload golden vectors.
on:
  workflow_dispatch:
  push:
    paths:
      - "DiPlay/compat/iap2/**"
      - "DiPlay/compat/bluetooth/**"
      - ".github/workflows/diplay-iap2-handshake.yml"
permissions:
  contents: read
jobs:
  compile-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Compile Java 7 and run offline handshake tests
        run: |
          set -euo pipefail
          mkdir -p build/iap2-test
          javac -source 1.7 -target 1.7 -Xlint:-options -d build/iap2-test \
            DiPlay/compat/bluetooth/BoundedByteRingBuffer.java \
            DiPlay/compat/bluetooth/RfcommConnectDeadline.java \
            DiPlay/compat/bluetooth/test/BoundedByteRingBufferTest.java \
            DiPlay/compat/bluetooth/test/RfcommConnectDeadlineTest.java \
            DiPlay/compat/iap2/Iap2DuplexByteStream.java \
            DiPlay/compat/iap2/Iap2StreamDuplexAdapter.java \
            DiPlay/compat/iap2/Iap2LinkPump.java \
            DiPlay/compat/iap2/Iap2CsmPumpSender.java \
            DiPlay/compat/iap2/Iap2LinkModelPumpDriver.java \
            DiPlay/compat/iap2/Iap2WirelessHandshake.java \
            DiPlay/compat/iap2/Iap2WirelessDeadlineBudget.java \
            DiPlay/compat/iap2/IapTunnelFrameDecoder.java \
            DiPlay/compat/iap2/IapTunnelPackageDecoder.java \
            DiPlay/compat/iap2/Iap2CsmFrameDecoder.java \
            DiPlay/compat/iap2/Iap2CsmFrameCodec.java \
            DiPlay/compat/iap2/Iap2CsmReceiveQueueModel.java \
            DiPlay/compat/iap2/Iap2CsmReceiveCoordinator.java \
            DiPlay/compat/iap2/Iap2CsmSendPlan.java \
            DiPlay/compat/iap2/Iap2LinkCommandQueueModel.java \
            DiPlay/compat/iap2/Iap2CsmSendDeadline.java \
            DiPlay/compat/iap2/Iap2CsmSendAdmissionModel.java \
            DiPlay/compat/iap2/Iap2CsmLinkGateModel.java \
            DiPlay/compat/iap2/Iap2LinkFrameCodec.java \
            DiPlay/compat/iap2/Iap2LinkFrameDecoder.java \
            DiPlay/compat/iap2/Iap2LinkNegotiationModel.java \
            DiPlay/compat/iap2/Iap2RetransmissionPolicy.java \
            DiPlay/compat/iap2/Iap2ReceiveWindowModel.java \
            DiPlay/compat/iap2/Iap2AckWindowPolicy.java \
            DiPlay/compat/iap2/Iap2OutboundWindowModel.java \
            DiPlay/compat/iap2/Iap2LinkEngineModel.java \
            DiPlay/compat/iap2/test/Iap2DuplexByteStreamTest.java \
            DiPlay/compat/iap2/test/Iap2LinkPumpContractTest.java \
            DiPlay/compat/iap2/test/Iap2CsmPumpSenderTest.java \
            DiPlay/compat/iap2/test/Iap2LinkModelPumpDriverTest.java \
            DiPlay/compat/iap2/test/Iap2WirelessHandshakeTest.java \
            DiPlay/compat/iap2/test/Iap2WirelessDeadlineBudgetTest.java \
            DiPlay/compat/iap2/test/IapTunnelFramingTest.java \
            DiPlay/compat/iap2/test/Iap2CsmFrameDecoderTest.java \
            DiPlay/compat/iap2/test/Iap2CsmFrameCodecTest.java \
            DiPlay/compat/iap2/test/Iap2CsmReceiveQueueModelTest.java \
            DiPlay/compat/iap2/test/Iap2CsmReceiveCoordinatorTest.java \
            DiPlay/compat/iap2/test/Iap2CsmSendPlanTest.java \
            DiPlay/compat/iap2/test/Iap2LinkCommandQueueModelTest.java \
            DiPlay/compat/iap2/test/Iap2CsmSendDeadlineTest.java \
            DiPlay/compat/iap2/test/Iap2CsmSendAdmissionModelTest.java \
            DiPlay/compat/iap2/test/Iap2CsmLinkGateModelTest.java \
            DiPlay/compat/iap2/test/Iap2LinkFrameCodecTest.java \
            DiPlay/compat/iap2/test/Iap2LinkFrameDecoderTest.java \
            DiPlay/compat/iap2/test/Iap2LinkNegotiationModelTest.java \
            DiPlay/compat/iap2/test/Iap2RetransmissionPolicyTest.java \
            DiPlay/compat/iap2/test/Iap2ReceiveWindowModelTest.java \
            DiPlay/compat/iap2/test/Iap2AckWindowPolicyTest.java \
            DiPlay/compat/iap2/test/Iap2OutboundWindowModelTest.java \
            DiPlay/compat/iap2/test/Iap2LinkEngineModelTest.java
          java -cp build/iap2-test com.shilapi.xcertplay.compat.bluetooth.BoundedByteRingBufferTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.bluetooth.RfcommConnectDeadlineTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2DuplexByteStreamTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2LinkPumpContractTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2CsmPumpSenderTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2LinkModelPumpDriverTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2WirelessHandshakeTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2WirelessDeadlineBudgetTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.IapTunnelFramingTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2CsmFrameDecoderTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2CsmFrameCodecTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2CsmReceiveQueueModelTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2CsmReceiveCoordinatorTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2CsmSendPlanTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2LinkCommandQueueModelTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2CsmSendDeadlineTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2CsmSendAdmissionModelTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2CsmLinkGateModelTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2LinkFrameCodecTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2LinkFrameDecoderTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2LinkNegotiationModelTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2RetransmissionPolicyTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2ReceiveWindowModelTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2AckWindowPolicyTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2OutboundWindowModelTest
          java -cp build/iap2-test com.shilapi.xcertplay.compat.iap2.Iap2LinkEngineModelTest
