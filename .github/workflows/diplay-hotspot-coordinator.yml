name: DiPlay Hotspot Transaction Coordinator Tests
on:
  workflow_dispatch:
  push:
    paths:
      - "DiPlay/compat/hotspot/**"
      - "DiPlay/compat/usb/**"
      - ".github/workflows/diplay-hotspot-coordinator.yml"
permissions:
  contents: read
jobs:
  compile-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Compile Java 7 source/bytecode and run self-test
        run: |
          set -euo pipefail
          mkdir -p build/hotspot-test build/usb-test
          javac -source 1.7 -target 1.7 -Xlint:-options -d build/hotspot-test DiPlay/compat/hotspot/HotspotTransactionCoordinator.java DiPlay/compat/hotspot/HotspotSafetyPrimitives.java DiPlay/compat/hotspot/AppendOnlyHotspotJournal.java DiPlay/compat/hotspot/HotspotRecoveryPolicy.java DiPlay/compat/hotspot/HotspotReadOnlyOperation.java DiPlay/compat/hotspot/HotspotReadOnlyExecutor.java DiPlay/compat/hotspot/HotspotDiagnosticParsers.java DiPlay/compat/hotspot/HotspotConfigBackupRecord.java DiPlay/compat/hotspot/test/CoordinatorSelfTest.java DiPlay/compat/hotspot/test/HotspotSafetyPrimitivesTest.java DiPlay/compat/hotspot/test/AppendOnlyHotspotJournalTest.java DiPlay/compat/hotspot/test/HotspotRecoveryPolicyTest.java DiPlay/compat/hotspot/test/HotspotReadOnlyOperationTest.java DiPlay/compat/hotspot/test/HotspotReadOnlyExecutorTest.java DiPlay/compat/hotspot/test/HotspotDiagnosticParsersTest.java DiPlay/compat/hotspot/test/HotspotConfigBackupRecordTest.java
          java -cp build/hotspot-test CoordinatorSelfTest
          java -cp build/hotspot-test HotspotSafetyPrimitivesTest
          java -cp build/hotspot-test AppendOnlyHotspotJournalTest
          java -cp build/hotspot-test HotspotRecoveryPolicyTest
          java -cp build/hotspot-test HotspotReadOnlyOperationTest
          java -cp build/hotspot-test HotspotReadOnlyExecutorTest
          java -cp build/hotspot-test HotspotDiagnosticParsersTest
          java -cp build/hotspot-test HotspotConfigBackupRecordTest
          javac -source 1.7 -target 1.7 -Xlint:-options -d build/usb-test DiPlay/compat/usb/UsbDeviceDescriptor.java DiPlay/compat/usb/test/UsbDeviceDescriptorTest.java
          java -cp build/usb-test UsbDeviceDescriptorTest
