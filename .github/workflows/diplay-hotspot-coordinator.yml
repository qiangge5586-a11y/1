name: DiPlay Hotspot Transaction Coordinator Tests
on:
  workflow_dispatch:
  push:
    paths:
      - "DiPlay/compat/hotspot/**"
      - ".github/workflows/diplay-hotspot-coordinator.yml"
permissions:
  contents: read
jobs:
  compile-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile Java 7-compatible code and run self-test
        run: |
          set -euo pipefail
          mkdir -p build/hotspot-test
          javac --release 7 -Xlint:-options -d build/hotspot-test DiPlay/compat/hotspot/HotspotTransactionCoordinator.java DiPlay/compat/hotspot/test/CoordinatorSelfTest.java
          java -cp build/hotspot-test CoordinatorSelfTest
