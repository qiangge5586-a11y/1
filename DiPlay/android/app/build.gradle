plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shilapi.xcertplay'
    compileSdk 35

    defaultConfig {
        // Separate application ID: this prototype will not replace the original DiPlay app.
        applicationId 'com.shilapi.xcertplay.compat'
        minSdk 17
        targetSdk 28
        versionCode 1
        versionName '0.1.0-honda-alpha'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }

    sourceSets {
        main {
            java {
                srcDirs = ['src/main/java', '../../compat/hotspot', '../../compat/usb', '../../compat/bluetooth']
                exclude 'test/**'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
